<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebEgg 连接设置</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-theme="dark">
    <main class="popup">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3c-4 0-7 5.1-7 10a7 7 0 0 0 14 0c0-4.9-3-10-7-10Z"/><path d="M8.5 12.5c.2-2 1.2-4 2.5-5.2"/></svg>
        </div>
        <div class="brand-copy">
          <h1>WebEgg</h1>
          <p>MONOCHROME · V0.9.7</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到日间模式" title="切换到日间模式">
          <span class="theme-track" aria-hidden="true"><i class="theme-star star-one"></i><i class="theme-star star-two"></i><span class="theme-thumb"><svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg></span></span>
        </button>
      </header>

      <div class="scope-note">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>后台驱动 Gemini 与本地工具；聊天和工具结果全部在 WebEgg 桌面端显示。</span>
      </div>

      <form id="settings-form">
        <div class="field">
          <label for="endpoint">MCP 地址</label>
          <input id="endpoint" name="endpoint" type="text" required spellcheck="false" autocomplete="off" />
        </div>
        <div class="field">
          <label for="token">连接令牌</label>
          <input id="token" name="token" type="password" required spellcheck="false" autocomplete="off" placeholder="we_..." />
        </div>
        <div id="status" class="status idle" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">填写桌面端生成的令牌后开始检测</span>
        </div>
        <button id="submit" type="submit">
          <span class="button-label">保存并检测连接</span>
          <span class="button-loading">正在检测…</span>
        </button>
      </form>
      <p class="privacy">令牌仅保存在扩展私有存储中，不会传入 Gemini 页面。</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>

name: Feature request
description: 提出新的能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      options:
        - 桌面 UI
        - 会话与历史
        - 工具能力
        - 浏览器适配器
        - 构建与发布
        - 其他
